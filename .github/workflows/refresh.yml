name: Refresh events

on:
  schedule:
    # Every 30 minutes, including nights and weekends. Off the busy hour boundary.
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - ingest.py
      - news.py
      - news_estimates.py
      - news_places.json
      - admin_boundaries.py
      - admin_boundaries.json.gz
      - weather_cap.py
      - source_freshness.py
      - build_map.py
      - navigation.js
      - facility_insights.js
      - test_facility_insights.cjs
      - test_navigation.cjs
      - turf.min.js
      - test_map_upgrades.py
      - requirements.txt
      - config.yaml
      - map_template.html
      - streamlit_app.py
      - stuck_tracker.py
      - stuck_tracker.js
      - test_stuck_tracker.py
      - test_stuck_tracker.cjs
      - test_news.py
      - test_news_estimates.py
      - test_news_ui.cjs
      - .github/workflows/refresh.yml
  workflow_dispatch:              # manual trigger button

concurrency:
  group: force-majeure-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run's trigger SHA can predate the preceding refresh commit.
          # Start from current main so generated JSON is never rebased over an
          # already-published snapshot from another run in this concurrency group.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check news ingestion and map controls
        run: |
          python -m unittest test_news test_news_estimates test_map_upgrades test_stuck_tracker -v
          node test_news_ui.cjs

      - name: Run ingest
        run: python ingest.py --config config.yaml

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add events.json impacted_facilities.csv state.json
          git diff --cached --quiet || git commit -m "auto refresh $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash
          git push

      - name: Keep app awake
        run: curl -s -o /dev/null https://spx-forcemajeure.streamlit.app || true
